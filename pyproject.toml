[project]
name = "rigad"
version = "0.1.0"
description = "Researcher Interest Group Allocation and Discovery — match draft papers to conference tracks, mentors across EUTOPIA, and thematic working groups"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vasili Mankevich", email = "vasili.mankevich@ait.gu.se" }]
keywords = ["eutopia", "research-collaboration", "group-formation", "openalex", "embeddings"]

dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Neural embeddings. Optional so the notebooks stay runnable without a ~2GB torch install:
# the TF-IDF+SVD backend in rigad.embed is a working fallback and an evaluation baseline.
neural = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[project.urls]
Repository = "https://github.com/VasiliMan/rigad"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
